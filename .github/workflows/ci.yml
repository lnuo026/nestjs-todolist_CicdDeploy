name: CI 

on: 
     push:
          branches: [main]
     pull_request:
          branches: [main]
     workflow_dispatch:     

jobs:
     build-and-test:
          runs-on: ubuntu-latest
          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Setup Node.js
                 uses: actions/setup-node@v4
                 with:
                    node-version: '24'
               
               - name: Install dependencies
                 working-directory: backend
                 run: npm ci

               - name: Run lint
                 working-directory: backend
                 run: npm run lint

               - name: Run unit tests
                 working-directory: backend 
                 run: npm run test

               - name: Build
                 working-directory: backend
                 run: npm run build
     
     build-and-test-frontend:
          runs-on: ubuntu-latest
          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Setup Node.js
                 uses: actions/setup-node@v4
                 with:
                    node-version: '24'
                
               - name: Install dependencies
                 working-directory: frontend
                 run: npm ci

               - name: Run lint
                 working-directory: frontend
                 run: npm run lint

               - name: Build
                 working-directory: frontend
                 run: npm run build  
